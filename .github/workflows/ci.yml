name: DevSecOps Build & Push

on:
  push:
    branches: [ "master" ]   # was "main" - your default branch is master, so this never ran before

permissions:
  contents: write   # needed so the workflow can commit the updated image tag back

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Single image: your app is one Flask container, not separate frontend/backend.
          # Build context is ./app (where the Dockerfile actually lives).
          docker build -t $ECR_REGISTRY/three-tier-app:$IMAGE_TAG -t $ECR_REGISTRY/three-tier-app:latest ./app
          docker push $ECR_REGISTRY/three-tier-app --all-tags

      - name: Update k8s manifest with real image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|three-tier-app:__IMAGE_TAG__|three-tier-app:${IMAGE_TAG}|g" k8s-manifests/app/app-deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/app/app-deployment.yaml
          git diff --quiet --cached || git commit -m "ci: deploy image ${GITHUB_SHA}"
          git push