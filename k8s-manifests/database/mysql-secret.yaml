# DO NOT commit real credentials to git.
# In practice: generate this with
#   kubectl create secret generic mysql-secret \
#     --namespace three-tier \
#     --from-literal=MYSQL_ROOT_PASSWORD='<a-real-strong-password>' \
#     --dry-run=client -o yaml > 01-mysql-secret.yaml
# or better, use AWS Secrets Manager + External Secrets Operator / Sealed Secrets
# so no plaintext secret ever lives in git.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: three-tier
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "YOUR_SECURE_PASSWORD_HERE" # Do not put real passwords in Git