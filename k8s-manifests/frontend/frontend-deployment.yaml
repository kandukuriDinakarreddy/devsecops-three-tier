apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: three-tier
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # Same as backend: replace __IMAGE_TAG__ with a real, immutable tag from CI.
        image: 879343932773.dkr.ecr.us-east-1.amazonaws.com/three-tier-frontend:__IMAGE_TAG__
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 20
        securityContext:
          runAsNonRoot: true
          # 101 is the default "nginx" user uid on the official nginx image.
          # If your frontend image uses a different base, check its Dockerfile
          # for the actual non-root uid (or add USER directive if missing).
          runAsUser: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]